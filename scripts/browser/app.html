<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>kcp + kubectl in the browser</title>
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
/>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0e14;
    --panel: #11151f;
    --border: #1f2633;
    --fg: #d5dbe5;
    --muted: #7c869a;
    --accent: #7aa2f7;
    --critical: #ef8b8b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .meta b { color: var(--fg); font-weight: 500; }
  #status { margin-left: auto; font-size: 12px; color: var(--muted); }
  #status.connected { color: #9ece6a; }
  #status.running { color: #e0af68; }
  #status.disconnected { color: var(--critical); }
  main {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  }
  #terminal-pane {
    min-width: 0;
    min-height: 0;
    padding: 8px;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  #terminal { width: 100%; height: 100%; }
  .xterm { height: 100%; }
  #diagram-pane {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    padding: 10px 14px;
    overflow: auto;
  }
  #diagram-pane h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 8px;
  }
  #diagram-pane h2 span { text-transform: none; letter-spacing: 0; font-weight: 400; }
  #diagram {
    flex: 1;
    min-height: 240px;
    --pele-bg: transparent;
    --pele-fg: #d5dbe5;
    --pele-muted: #7c869a;
    --pele-line: #4c566a;
    --pele-surface: #151a25;
    --pele-surface-alt: #11151f;
    --pele-border: #2a3242;
    --pele-accent: #7aa2f7;
    --pele-critical: #ef8b8b;
    --pele-radius: 6px;
  }
  #diagram svg { max-width: 100%; height: auto; }
  #diagram .error { color: var(--critical); white-space: pre-wrap; }
  footer {
    padding: 6px 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    background: var(--panel);
  }
</style>
</head>
<body>
<header>
  <h1>kcp + kubectl in the browser</h1>
  <span class="meta">api <b id="server">…</b></span>
  <span id="status">starting…</span>
</header>
<main>
  <section id="terminal-pane"><div id="terminal"></div></section>
  <section id="diagram-pane">
    <h2>Live API surface <span id="diagram-updated">waiting for first poll…</span></h2>
    <div id="diagram"></div>
  </section>
</main>
<footer>
  kcp.wasm and kubectl.wasm both run in this browser tab (Web Workers);
  the Deno server only serves files. Diagram is polled with kubectl and
  rendered by Pele.
</footer>

<script src="https://cdn.jsdelivr.net/npm/pele@1/dist/pele.global.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
