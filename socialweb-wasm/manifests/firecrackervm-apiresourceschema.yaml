apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-6.firecrackervms.socialweb.computer
  labels:
    contracts.socialweb.computer/computevms: v1alpha1
spec:
  group: socialweb.computer
  names:
    kind: FirecrackerVM
    listKind: FirecrackerVMList
    plural: firecrackervms
    singular: firecrackervm
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              owner:
                type: object
                properties:
                  handle:
                    type: string
                required:
                  - handle
              vcpu:
                type: integer
                format: int32
              mem:
                type: string
              disk:
                type: string
              image:
                type: object
                properties:
                  reuseStale:
                    type: boolean
              userData:
                type: object
                properties:
                  vault:
                    type: object
                    properties:
                      vault:
                        type: object
                        properties:
                          group:
                            type: string
                          kind:
                            type: string
                            maxLength: 63
                          name:
                            type: string
                            maxLength: 253
                          workspace:
                            type: string
                        required:
                          - kind
                          - name
                      mount:
                        type: string
                      path:
                        type: string
                      key:
                        type: string
                    required:
                      - mount
                      - path
                required:
                  - vault
              stopGraceSeconds:
                type: integer
                format: int32
              hostPorts:
                type: array
                items:
                  type: integer
                  format: int32
                x-kubernetes-list-type: set
              guestNetwork:
                type: object
                properties:
                  lanUDP:
                    type: boolean
                  hostUDP:
                    type: boolean
            required:
              - owner
              - vcpu
              - mem
              - disk
              - userData
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
                enum:
                  - Pending
                  - Preparing
                  - Booting
                  - Running
                  - Releasing
                  - Lost
                  - Failed
              lostReason:
                type: string
                enum:
                  - HostRebooted
                  - UnitGone
                  - UnitFailed
                  - OOMKilled
                  - VMMExited
                  - GuestPoweroff
                  - IdentityMismatch
              network:
                type: object
                properties:
                  guestIP:
                    type: string
                  hostAddress:
                    type: string
                  prefix:
                    type: integer
                    format: int32
                  mac:
                    type: string
                  tap:
                    type: string
              image:
                type: object
                properties:
                  ref:
                    type: string
                  sha256:
                    type: string
                  hypervisor:
                    type: string
              runtime:
                type: object
                properties:
                  backend:
                    type: string
                  hypervisor:
                    type: string
                  unit:
                    type: string
                  invocationID:
                    type: string
                  pid:
                    type: integer
                    format: int64
                  startTicks:
                    type: integer
                    format: int64
                  startTime:
                    type: string
                  hostBootID:
                    type: string
                  manager:
                    type: string
                  vmmID:
                    type: string
                  vmmUID:
                    type: integer
                    format: int64
                  slot:
                    type: integer
                    format: int32
                  socket:
                    type: string
              workDir:
                type: string
              bootedAt:
                type: string
              message:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: GuestIP
          type: string
          jsonPath: .status.network.guestIP
        - name: Unit
          type: string
          jsonPath: .status.runtime.unit
        - name: PID
          type: integer
          jsonPath: .status.runtime.pid
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
