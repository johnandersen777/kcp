apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-2.childapplications.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: ChildApplication
    listKind: ChildApplicationList
    plural: childapplications
    singular: childapplication
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              networkRef:
                type: object
                properties:
                  name:
                    type: string
                    maxLength: 253
                required:
                  - name
              app:
                type: string
              profile:
                type: string
              placement:
                type: string
            required:
              - networkRef
              - app
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              workspace:
                type: string
              coreRef:
                type: string
              components:
                type: array
                items:
                  type: object
                  properties:
                    kind:
                      type: string
                    name:
                      type: string
                    ready:
                      type: boolean
                  required:
                    - kind
                    - name
                    - ready
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Network
          type: string
          jsonPath: .spec.networkRef.name
        - name: App
          type: string
          jsonPath: .spec.app
        - name: Workspace
          type: string
          jsonPath: .status.workspace
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
