apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-2.marketpresences.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: MarketPresence
    listKind: MarketPresenceList
    plural: marketpresences
    singular: marketpresence
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              bidderRef:
                type: object
                properties:
                  group:
                    type: string
                  kind:
                    type: string
                    maxLength: 63
                  name:
                    type: string
                    maxLength: 253
                  workspace:
                    type: string
                required:
                  - kind
                  - name
              offeringUri:
                type: string
              ttlSeconds:
                type: integer
            required:
              - bidderRef
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
                enum:
                  - Active
                  - Expired
              ready:
                type: boolean
              lastHeartbeatAt:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            required:
              - ready
      additionalPrinterColumns:
        - name: Offering
          type: string
          jsonPath: .spec.offeringUri
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Heartbeat
          type: string
          jsonPath: .status.lastHeartbeatAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
