apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-1.contractevents.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: ContractEvent
    listKind: ContractEventList
    plural: contractevents
    singular: contractevent
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              contractRef:
                type: object
                properties:
                  name:
                    type: string
                    maxLength: 253
                required:
                  - name
              direction:
                type: string
                enum:
                  - outbound
                  - inbound
                default: outbound
              nsid:
                type: string
                enum:
                  - com.publicdomainrelay.temp.compute.events.guest.publicKey
                  - com.publicdomainrelay.temp.compute.events.guest.signalWebRTC
              kind:
                type: string
                maxLength: 32
              tag:
                type: string
                pattern: ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$
              key:
                type: string
                maxLength: 256
              ciphertext:
                type: string
                maxLength: 16384
            required:
              - contractRef
              - nsid
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
                enum:
                  - Pending
                  - Published
                  - Submitted
                  - Received
                  - Failed
              message:
                type: string
              record:
                type: object
                properties:
                  uri:
                    type: string
                  cid:
                    type: string
                required:
                  - uri
                  - cid
              event:
                type: object
                properties:
                  uri:
                    type: string
                  cid:
                    type: string
                required:
                  - uri
                  - cid
              submit:
                type: object
                properties:
                  endpoint:
                    type: string
                  attempts:
                    type: integer
                    format: int32
                  lastAttemptAt:
                    type: string
                  submittedAt:
                    type: string
                  lastError:
                    type: string
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Contract
          type: string
          jsonPath: .spec.contractRef.name
        - name: Direction
          type: string
          jsonPath: .spec.direction
        - name: NSID
          type: string
          jsonPath: .spec.nsid
        - name: Tag
          type: string
          jsonPath: .spec.tag
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
