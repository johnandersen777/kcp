apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-4.hostprocesses.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: HostProcess
    listKind: HostProcessList
    plural: hostprocesses
    singular: hostprocess
  scope: Cluster
  versions:
    - name: v1alpha1
