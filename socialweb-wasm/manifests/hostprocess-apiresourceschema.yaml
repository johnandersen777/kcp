                  - supervisor
                  - bootstrap
            required:
              - unit
              - placement
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
                enum:
                  - Pending
                  - Starting
                  - Running
                  - Stopping
                  - Stopped
                  - Failed
                  - Lost
              lostReason:
                type: string
                enum:
                  - HostRebooted
                  - UnitGone
                  - UnitFailed
                  - OOMKilled
                  - IdentityMismatch
                  - ManagerRestarted
              message:
                type: string
              runtime:
                type: object
