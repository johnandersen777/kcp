                  - name
                  - sha256
              exec:
                type: string
              argv:
                type: array
                items:
                  type: string
              env:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    value:
                      type: string
                  required:
                    - name
                    - value
              envFiles:
                type: array
                items:
                  type: string
              workDir:
                type: string
              output:
                type: object
                properties:
                  stdout:
                    type: string
                  stderr:
                    type: string
                  capBytes:
                    type: integer
                    format: int64
              limits:
                type: object
                properties:
                  memoryMax:
                    type: string
                  cpuWeight:
                    type: integer
                    format: int64
                  cpuQuotaPercent:
                    type: integer
                    format: int32
                  tasksMax:
                    type: integer
                    format: int64
              restartPolicy:
                type: string
                enum:
                  - Never
                  - OnFailure
                  - Always
              stop:
                type: object
                properties:
                  signal:
                    type: string
                  graceSeconds:
                    type: integer
                    format: int32
              after:
                type: array
                items:
                  type: string
              wants:
                type: array
                items:
                  type: string
              slice:
                type: string
              privateHostname:
                type: string
              fdStore:
                type: integer
                format: int32
              readiness:
                type: object
                properties:
                  exec:
                    type: array
                    items:
                      type: string
                  tcp:
                    type: boolean
                  httpPath:
                    type: string
                  pgxSocketDir:
                    type: string
                  unixSocket:
                    type: string
              restartKey:
                type: string
              placement:
                type: string
