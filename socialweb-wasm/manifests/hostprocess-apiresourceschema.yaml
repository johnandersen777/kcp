          jsonPath: .spec.placement
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Backend
          type: string
          jsonPath: .status.runtime.backend
        - name: Unit
          type: string
          jsonPath: .spec.unit
        - name: PID
          type: integer
          jsonPath: .status.runtime.pid
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
