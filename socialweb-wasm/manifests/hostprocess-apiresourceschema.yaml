      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              unit:
                type: string
              description:
                type: string
              asset:
                type: object
                properties:
                  name:
                    type: string
                  sha256:
                    type: string
