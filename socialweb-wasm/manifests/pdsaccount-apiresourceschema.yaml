apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-2.pdsaccounts.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: PdsAccount
    listKind: PdsAccountList
    plural: pdsaccounts
    singular: pdsaccount
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              did:
                type: string
              handle:
                type: string
              pdsRef:
                type: object
                properties:
                  group:
                    type: string
                  kind:
                    type: string
                    maxLength: 63
                  name:
                    type: string
                    maxLength: 253
                  workspace:
                    type: string
                required:
                  - kind
                  - name
            required:
              - did
              - handle
              - pdsRef
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              active:
                type: boolean
              hasPassword:
                type: boolean
              appPasswordCount:
                type: integer
                format: int32
              sessionCount:
                type: integer
                format: int32
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: DID
          type: string
          jsonPath: .spec.did
        - name: Handle
          type: string
          jsonPath: .spec.handle
        - name: Active
          type: boolean
          jsonPath: .status.active
        - name: Sessions
          type: integer
          jsonPath: .status.sessionCount
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
