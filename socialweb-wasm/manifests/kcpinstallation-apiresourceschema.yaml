apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-1.kcpinstallations.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: KcpInstallation
    listKind: KcpInstallationList
    plural: kcpinstallations
    singular: kcpinstallation
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              selectedSlot:
                type: string
                enum:
                  - a
                  - b
              frontBackend:
                type: string
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              activeSlot:
                type: string
                enum:
                  - a
                  - b
              frontBackend:
                type: string
              message:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: SelectedSlot
          type: string
          jsonPath: .spec.selectedSlot
        - name: ActiveSlot
          type: string
          jsonPath: .status.activeSlot
        - name: FrontBackend
          type: string
          jsonPath: .status.frontBackend
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
