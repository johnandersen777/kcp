apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-1.statesyncs.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: StateSync
    listKind: StateSyncList
    plural: statesyncs
    singular: statesync
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              source:
                type: object
                properties:
                  workspace:
                    type: string
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  uid:
                    type: string
                  generation:
                    type: integer
                    format: int64
              sink:
                type: object
                properties:
                  adapter:
                    type: string
                  workspace:
                    type: string
                  collection:
                    type: string
                  target:
                    type: string
                  submitEventUrl:
                    type: string
                required:
                  - adapter
              direction:
                type: string
                enum:
                  - Outbound
                  - Inbound
                  - Both
              payload:
                type: object
                x-kubernetes-preserve-unknown-fields: true
              idempotencyKey:
                type: string
              conflictPolicy:
                type: string
                enum:
                  - SourceWins
                  - TargetWins
                  - ReportOnly
              deletionPolicy:
                type: string
                enum:
                  - Retain
                  - DeleteRemote
                  - AckThenDelete
              ack:
                type: object
                properties:
                  paths:
                    type: array
                    items:
                      type: string
                  fieldManager:
                    type: string
              retry:
                type: object
                properties:
                  maxAttempts:
                    type: integer
                  backoffSeconds:
                    type: integer
              suspend:
                type: boolean
            required:
              - sink
              - idempotencyKey
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
                enum:
                  - Pending
                  - Delivering
                  - Acked
                  - Drifted
                  - Failed
                  - Stalled
              desiredHash:
                type: string
              observed:
                type: object
                properties:
                  exists:
                    type: boolean
                  ref:
                    type: string
                  cid:
                    type: string
                  hash:
                    type: string
                  at:
                    type: string
                  meta:
                    type: object
                    additionalProperties:
                      type: string
                required:
                  - exists
              acked:
                type: object
                properties:
                  ref:
                    type: string
                  cid:
                    type: string
                  at:
                    type: string
                  eventUri:
                    type: string
                  eventCid:
                    type: string
              cursor:
                type: integer
                format: int64
              attempts:
                type: integer
              lastAttemptAt:
                type: string
              lastError:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Adapter
          type: string
          jsonPath: .spec.sink.adapter
        - name: Direction
          type: string
          jsonPath: .spec.direction
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Observed
          type: boolean
          jsonPath: .status.observed.exists
        - name: Key
          type: string
          jsonPath: .spec.idempotencyKey
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
