apiVersion: apis.kcp.io/v1alpha1
kind: APIResourceSchema
metadata:
  name: v1alpha1-2.clusterrolls.socialweb.computer
spec:
  group: socialweb.computer
  names:
    kind: ClusterRoll
    listKind: ClusterRollList
    plural: clusterrolls
    singular: clusterroll
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              clusterRef:
                type: object
                properties:
                  name:
                    type: string
                    maxLength: 253
                required:
                  - name
              strategy:
                type: string
              maxUnavailable:
                type: integer
                format: int32
            required:
              - clusterRef
              - strategy
              - maxUnavailable
          status:
            type: object
            properties:
              observedGeneration:
                type: integer
                format: int64
              phase:
                type: string
                enum:
                  - Pending
                  - Running
                  - Completed
                  - Failed
              startedAt:
                type: string
              completedAt:
                type: string
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Cluster
          type: string
          jsonPath: .spec.clusterRef.name
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Started
          type: string
          jsonPath: .status.startedAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
