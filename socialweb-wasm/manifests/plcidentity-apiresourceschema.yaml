              tombstoned:
                type: boolean
              conditions:
                type: array
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: DID
          type: string
          jsonPath: .spec.did
        - name: Operations
          type: integer
          jsonPath: .status.opCount
        - name: Tombstoned
          type: boolean
          jsonPath: .status.tombstoned
        - name: Age
